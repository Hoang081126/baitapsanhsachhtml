<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form sở thích và đăng ký học viên</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, Tahoma, sans-serif;
            line-height: 1.5;
        }
        main { max-width: 760px; margin: 0 auto; }
        .panel {
            margin-bottom: 28px;
            padding: 24px;
            background: #fff;
            border: 1px solid #dbe3eb;
            border-radius: 10px;
        }
        h1, h2 {
            margin: 0 0 24px;
            padding: 12px;
            border-radius: 5px;
            font-size: 23px;
            text-align: center;
        }
        h1 { background: #d94b16; color: #fff; }
        h2 { background: #d9f0e5; color: #145c3c; }
        .registration { background: #fffdf0; }
        .row {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr);
            gap: 16px;
            align-items: start;
            margin-bottom: 18px;
        }
        .row > label, .field-title {
            padding-top: 8px;
            color: #1e40af;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], input[type="date"], select, textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            background: #fff;
            color: #1e293b;
            font: inherit;
        }
        textarea { min-height: 90px; resize: vertical; }
        input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }
        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            padding-top: 8px;
        }
        .choices label { display: inline-flex; align-items: center; gap: 7px; }
        input[type="checkbox"], input[type="radio"] { margin: 0; accent-color: #1d4ed8; }
        .interests .choices { color: #b84416; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-left: 166px; }
        button {
            padding: 10px 20px;
            border: 1px solid #1d4ed8;
            border-radius: 5px;
            background: #1d4ed8;
            color: #fff;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        button[type="reset"] { border-color: #94a3b8; background: #fff; color: #334155; }
        button:hover { filter: brightness(0.95); }
        @media (max-width: 560px) {
            body { padding: 16px 10px; }
            .panel { padding: 18px; }
            .row { grid-template-columns: 1fr; gap: 6px; }
            .row > label, .field-title, .choices { padding-top: 0; }
            .actions { margin-left: 0; }
            h1, h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
<main>
    <section class="panel interests" aria-labelledby="interests-title">
        <h1 id="interests-title">SỞ THÍCH CỦA BẠN</h1>
        <form action="forms.html" method="get">
            <div class="row">
                <label for="yourname">Họ và tên</label>
                <input type="text" id="yourname" name="yourname" autocomplete="name">
            </div>
            <div class="row">
                <label for="interest-email">Email</label>
                <input type="text" id="interest-email" name="email" autocomplete="email">
            </div>
            <div class="row">
                <span class="field-title" id="hobby-title">Sở thích</span>
                <div class="choices" role="group" aria-labelledby="hobby-title">
                    <label><input type="checkbox" name="hobby" value="the-thao"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="am-nhac"> Âm nhạc</label>
                    <label><input type="checkbox" name="hobby" value="doc-sach"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="luot-web"> Lướt web</label>
                    <label><input type="checkbox" name="hobby" value="choi-game"> Chơi game</label>
                    <label><input type="checkbox" name="hobby" value="dien-anh"> Điện ảnh</label>
                    <label><input type="checkbox" name="hobby" value="du-lich"> Du lịch</label>
                </div>
            </div>
            <div class="actions">
                <button type="submit">Gửi thông tin</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </section>

    <section class="panel registration" aria-labelledby="registration-title">
        <h2 id="registration-title">ĐĂNG KÝ HỌC VIÊN</h2>
        <form action="forms.html" method="get">
            <div class="row">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" name="fullname" autocomplete="name">
            </div>
            <div class="row">
                <label for="registration-email">Email</label>
                <input type="email" id="registration-email" name="email" autocomplete="email">
            </div>
            <div class="row">
                <label for="phone">Số điện thoại</label>
                <input type="text" id="phone" name="phone" inputmode="tel" autocomplete="tel">
            </div>
            <div class="row">
                <label for="birthday">Ngày sinh</label>
                <input type="date" id="birthday" name="birthday" autocomplete="bday">
            </div>
            <div class="row">
                <span class="field-title" id="gender-title">Giới tính</span>
                <div class="choices" role="radiogroup" aria-labelledby="gender-title">
                    <label><input type="radio" name="gender" value="Nam"> Nam</label>
                    <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
                    <label><input type="radio" name="gender" value="Khác"> Khác</label>
                </div>
            </div>
            <div class="row">
                <label for="address">Địa chỉ</label>
                <textarea id="address" name="address" rows="3" autocomplete="street-address"></textarea>
            </div>
            <div class="row">
                <label for="course">Khóa học</label>
                <select id="course" name="course">
                    <option value="">-- Chọn khóa học --</option>
                    <option value="HTML &amp; CSS">HTML &amp; CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                </select>
            </div>
            <div class="row">
                <span class="field-title" id="study-title">Hình thức học</span>
                <div class="choices" role="radiogroup" aria-labelledby="study-title">
                    <label><input type="radio" name="study_type" value="Online"> Online</label>
                    <label><input type="radio" name="study_type" value="Offline"> Offline</label>
                </div>
            </div>
            <div class="row">
                <span class="field-title" id="registration-hobby-title">Sở thích</span>
                <div class="choices" role="group" aria-labelledby="registration-hobby-title">
                    <label><input type="checkbox" name="hobby" value="doc-sach"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="am-nhac"> Âm nhạc</label>
                    <label><input type="checkbox" name="hobby" value="the-thao"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="lap-trinh"> Lập trình</label>
                    <label><input type="checkbox" name="hobby" value="du-lich"> Du lịch</label>
                </div>
            </div>
            <div class="row">
                <label for="note">Ghi chú</label>
                <textarea id="note" name="note" rows="3"></textarea>
            </div>
            <div class="actions">
                <button type="submit">Đăng ký</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
